const R=43, W=26;
function capsule(x1,y1,x2,y2,r){
  const L=Math.hypot(x2-x1,y2-y1), ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux;
  const a1=[x1+nx*r,y1+ny*r], b1=[x2+nx*r,y2+ny*r], b2=[x2-nx*r,y2-ny*r], a2=[x1-nx*r,y1-ny*r];
  const f=p=>p[0].toFixed(1)+","+p[1].toFixed(1);
  return `M${f(a1)} L${f(b1)} A${r} ${r} 0 0 0 ${f(b2)} L${f(a2)} A${r} ${r} 0 0 0 ${f(a1)} Z`;
}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}

function buildMark(svg,{dial}){
  svg.innerHTML="";
  const defs=el("defs",{},svg);
  const g=el("linearGradient",{id:svg.id+"g",gradientUnits:"userSpaceOnUse",x1:0,y1:160,x2:0,y2:860},defs);
  el("stop",{offset:0,"stop-color":"#4a4c50"},g); el("stop",{offset:1,"stop-color":"#2a2b2e"},g);
  const parts={};
  if(dial){
    const d=el("g",{id:"dial",transform:"translate(512 512)",opacity:0},svg);
    el("circle",{r:492,fill:"none",stroke:"#1b1c1f","stroke-width":2},d);
    const ticks=el("g",{},d);
    for(let i=0;i<120;i++){
      const a=i*3*Math.PI/180, big=i%10===0, r1=big?458:470;
      el("line",{x1:Math.cos(a)*r1,y1:Math.sin(a)*r1,x2:Math.cos(a)*484,y2:Math.sin(a)*484,
        stroke:big?"#565a62":"#2a2b2e","stroke-width":big?3:2},ticks);
    }
    el("path",{d:"M0,-512 L-10,-532 L10,-532 Z",fill:"#c0393f",transform:"rotate(0)",id:"notch"},svg).setAttribute("transform","translate(512 512)");
    parts.dial=d; parts.ticks=ticks;
  }
  const m=el("g",{transform:"translate(512,512) scale(0.92) translate(-505,-507)"},svg);
  // red glows like the logo
  parts.logo=el("image",{href:LOGO,x:0,y:0,width:1024,height:1024,opacity:0},svg);
  parts.links=LINKS.map(l=>{
    const p=el("path",{d:capsule(...l,R),fill:"none",stroke:"#898781","stroke-width":2.5,"stroke-linejoin":"round"},m);
    const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len; p._len=len;
    return p;
  });
  return parts;
}
document.getElementById("smallMark").src=LOGO;

/* ---------- background canvas ---------- */
const cv=document.getElementById("bg"), cx=cv.getContext("2d");
let DPR=1,VW=0,VH=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize); resize();

/* tape */
const prints=DATA.prints; // [ms,price,size,side]
function fmtT(ms){const s=Math.floor(ms/1000),r=ms%1000;return "09:30:"+String(s).padStart(2,"0")+"."+String(r).padStart(3,"0")}
let tape={pos:0,speed:0,alpha:1,cols:null};
function tapeCols(){const cw=Math.max(190,Math.min(230,VW/6));const n=Math.max(2,Math.floor(VW/cw));return {n,cw:VW/n}}
function drawTape(dt,mode){
  const {n,cw}=tapeCols(), rh=17;
  cx.save(); cx.font="12px "+getComputedStyle(document.body).getPropertyValue("--mono"); cx.textBaseline="top";
  const rows=Math.ceil(VH/rh)+2;
  for(let c=0;c<n;c++){
    const off=(c*997)%prints.length;
    for(let r=0;r<rows;r++){
      const fp=tape.pos+off-r, idx=((Math.floor(fp)%prints.length)+prints.length)%prints.length;
      const p=prints[idx], yy=(r-(fp%1))*rh + (c%2?rh*.5:0);
      const big=Math.min(1,p[2]/20);
      const a=tape.alpha*(.5+.5*big)*(1-r/rows*.35);
      cx.fillStyle = p[3]==="B"?`rgba(195,194,183,${a})`:`rgba(192,57,63,${a})`;
      const x=c*cw+14;
      cx.fillText(fmtT(p[0]),x,yy);
      cx.fillText(p[1].toFixed(2),x+cw*.47,yy);
      cx.textAlign="right"; cx.fillText(String(p[2]),x+cw-28,yy); cx.textAlign="left";
    }
  }
  cx.restore();
}
/* ambient tape for B after the intro: one column, real pace */
let amb={t:0};
function drawAmbient(dt,alpha){
  amb.t+=dt; const T=amb.t%45000;
  let k=0; while(k<prints.length-1 && prints[k+1][0]<=T)k++;
  const narrow=VW<700, colW=narrow?VW:250, x=narrow?16:VW-colW-10, rh=16, rows=Math.ceil(VH/rh);
  cx.save(); cx.font="11.5px "+getComputedStyle(document.body).getPropertyValue("--mono"); cx.textBaseline="top";
  for(let r=0;r<rows;r++){
    const p=prints[k-r]; if(!p)break;
    const big=Math.min(1,p[2]/20), a=alpha*(narrow?.3:.9)*(.5+.5*big)*Math.pow(1-r/rows,1.3);
    cx.fillStyle=p[3]==="B"?`rgba(195,194,183,${a})`:`rgba(192,57,63,${a})`;
    cx.fillText(fmtT(p[0]),x,r*rh+10); cx.fillText(p[1].toFixed(2),x+colW*.5,r*rh+10);
    cx.textAlign="right"; cx.fillText(String(p[2]),x+colW-16,r*rh+10); cx.textAlign="left";
  }
  cx.restore();
}

/* ---------- the timelines ---------- */
let mode="A", t0=0, last=0, parts=null, timers=[];
const intro=document.getElementById("intro"), svg=document.getElementById("introSvg");
const page=document.getElementById("page"), foot=document.getElementById("foot");
function at(ms,fn){timers.push(setTimeout(fn,ms))}
function drawLink(p,dur){p.animate([{strokeDashoffset:p._len},{strokeDashoffset:0}],{duration:dur,easing:"cubic-bezier(.6,0,.2,1)",fill:"forwards"})}
function solidify(){
  parts.links.forEach((p,i)=>p.animate([{strokeWidth:2.5,opacity:1},{strokeWidth:W,opacity:.0}],{duration:900,easing:"cubic-bezier(.3,0,.1,1)",fill:"forwards"}));
  parts.logo.animate([{opacity:0},{opacity:1}],{duration:900,easing:"ease-out",fill:"forwards"});
}
function start(m){
  mode=m; timers.forEach(clearTimeout); timers=[];
  intro.classList.remove("away"); document.querySelector(".vignette").classList.toggle("soft",m==="B"); page.classList.remove("on"); foot.classList.remove("on");
  parts=buildMark(svg,{dial:m==="A"});
  tape={pos:0,speed:0,alpha:1}; amb.t=0;
  t0=performance.now();
  document.getElementById("recLabel").textContent = m==="A" ? "ES · TIME & SALES · 10 NOV 2026 · 09:30 ET · RECORDED" : "ES · TIME & SALES · 10 NOV 2026 · 09:30 ET";
  if(m==="A"){
    const d=parts.dial;
    d.animate([{opacity:0},{opacity:1}],{duration:700,delay:200,fill:"forwards"});
    // the combination: fast spin, then three settling turns, each click draws a link
    parts.ticks.animate([
      {transform:"rotate(0deg)"},{transform:"rotate(-420deg)",offset:.38},
      {transform:"rotate(-300deg)",offset:.56},{transform:"rotate(-372deg)",offset:.74},{transform:"rotate(-348deg)"}
    ],{duration:2300,delay:250,easing:"cubic-bezier(.45,0,.2,1)",fill:"forwards"});
    at(900,()=>drawLink(parts.links[0],520));
    at(1310,()=>drawLink(parts.links[1],520));
    at(1720,()=>drawLink(parts.links[2],520));
    at(2130,()=>drawLink(parts.links[3],420));
    at(2560,()=>{solidify(); d.animate([{opacity:1},{opacity:0}],{duration:900,delay:300,fill:"forwards"})});
    at(3500,()=>intro.classList.add("away"));
    at(3900,()=>{page.classList.add("on");foot.classList.add("on")});
  }else{
    at(2500,()=>{ LINKS.forEach((_,i)=>at(i*330,()=>drawLink(parts.links[i],560))) });
    at(4100,()=>solidify());
    at(3000,()=>document.querySelector(".vignette").classList.remove("soft"));
    at(5000,()=>intro.classList.add("away"));
    at(5400,()=>{page.classList.add("on");foot.classList.add("on")});
  }
}
function frame(now){
  const dt=Math.min(64,now-(last||now)); last=now; const e=now-t0;
  cx.clearRect(0,0,VW,VH);
  if(mode==="A"){
    if(e>3700) drawAmbient(dt,Math.min(1,(e-3700)/1500));
  }else{
    // stream: very fast, decelerating to a stop at 2.5 s
    if(e<2500){const k=1-e/2500; tape.pos+=dt/1000*(14+520*k*k)}
    tape.alpha = e<2500?1 : Math.max(.06,1-(e-2500)/700);
    if(e<6000 || tape.alpha>.06) drawTape(dt);
    if(e>5000) drawAmbient(dt,Math.min(1,(e-5000)/1500));
  }
  requestAnimationFrame(frame);
}
let skipped=false;
function skip(){ if(skipped)return; skipped=true; timers.forEach(clearTimeout); timers=[];
  intro.style.display="none"; page.classList.add("on"); foot.classList.add("on"); t0=performance.now()-3700; }
start("A");
if(matchMedia("(prefers-reduced-motion: reduce)").matches) skip();
addEventListener("pointerdown",()=>{ if(!page.classList.contains("on")) skip(); });
addEventListener("keydown",()=>{ if(!page.classList.contains("on")) skip(); });
document.getElementById("join").addEventListener("click",()=>{ try{plausible("Join click")}catch(e){} });
requestAnimationFrame(frame);
</script>
</body>
